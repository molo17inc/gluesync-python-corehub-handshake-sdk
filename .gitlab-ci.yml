image: python:3.11-slim

default:
  tags:
    - gs-runners-hq
stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

before_script:
  - python -V
  - apt-get update && apt-get install -y gcc python3-dev
  - pip install -U pip
  - pip install -e .
  - pip install pytest pytest-asyncio
  - echo "$GLUESYNC_LICENSE_CONTENT" > gs-license.dat

run_tests:
  stage: test
  only:
    - main
    - develop
    - merge_requests
  script:
    - pytest -v tests/
  artifacts:
    reports:
      junit: report.xml
    when: always
    expire_in: 1 day

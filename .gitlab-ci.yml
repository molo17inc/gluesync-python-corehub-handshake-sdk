image: gradle:8.8-jdk21

default:
  tags:
    - gs-runners-hq

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  CI: "true"
  PYTHONUNBUFFERED: "1"

cache:
  paths:
    - .pip-cache/

before_script:
  # Install Python and required dependencies
  - apt-get update && apt-get install -y python3 python3-pip python3-dev gcc
  - python3 -V
  - pip3 install -U pip
  - pip3 install -e .
  - pip3 install pytest pytest-asyncio pytest-timeout
  - echo "$GLUESYNC_LICENSE_CONTENT" > gs-license.dat

run_tests:
  stage: test
  only:
    - main
    - develop
    - merge_requests
  script:
    - pytest -v --asyncio-mode=strict --junitxml=report.xml --timeout=30 tests/
  artifacts:
    reports:
      junit: report.xml
    when: always
    expire_in: 1 day

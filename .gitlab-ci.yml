image: python:3.11-slim

default:
  tags:
    - gs-runners-hq
services:
  - name: molo17/gluesync-core-hub:latest
    alias: corehub
    variables:
      DOCKER_TLS_CERTDIR: ""

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  CI: "true"
  DOCKER_HOST_NETWORK: "true"

cache:
  paths:
    - .pip-cache/

before_script:
  - python -V
  - apt-get update && apt-get install -y gcc python3-dev
  - pip install -U pip
  - pip install -e .
  - pip install pytest pytest-asyncio pytest-timeout
  - echo "$GLUESYNC_LICENSE_CONTENT" > gs-license.dat

run_tests:
  stage: test
  only:
    - main
    - develop
    - merge_requests
  script:
    - pytest -v --asyncio-mode=strict --junitxml=report.xml --timeout=30 tests/
  artifacts:
    reports:
      junit: report.xml
    when: always
    expire_in: 1 day

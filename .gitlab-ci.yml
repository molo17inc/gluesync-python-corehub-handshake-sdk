image: gradle:8.8-jdk21

default:
  tags:
    - gs-runners-hq

stages:
  - build
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PIP_INDEX_URL: "https://nexus.hq.molo17.com/repository/pypi-all/simple"
  CI: "true"
  PYTHONUNBUFFERED: "1"

cache:
  paths:
    - .pip-cache/

before_script:
  # Install Python and required dependencies
  - apt-get update && apt-get install -y python3 python3-pip python3-dev gcc
  - python3 -V
  - pip3 install -U pip

build_wheel:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-.*$/'
  script:
    - pip3 install --break-system-packages build wheel setuptools
    # Derive package version from tag: release-<version>
    - |
      VERSION="${CI_COMMIT_TAG#release-}"
      # Strip optional leading 'v' (e.g., release-v1.2.3 -> 1.2.3)
      VERSION="${VERSION#v}"
      if [ -z "$VERSION" ]; then echo "Version could not be derived from tag $CI_COMMIT_TAG" >&2; exit 1; fi
      export VERSION
      echo "Using package version: $VERSION"
    - |
      python3 - <<'PY'
      import io, re
      p = 'setup.py'
      s = io.open(p, 'r', encoding='utf-8').read()
      ns = re.sub(r'(?m)^(\s*version=)"[^"]+"', rf'\1"{__import__("os").environ["VERSION"]}"', s)
      if s == ns:
          print('setup.py version unchanged (pattern not found)?', flush=True)
      io.open(p, 'w', encoding='utf-8').write(ns)
      print('setup.py version updated')
      PY
    - python3 -m build
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 1 week

run_tests:
  stage: test
  only:
    - main
    - develop
    - merge_requests
  script:
    - echo "$GLUESYNC_LICENSE_CONTENT" > gs-license.dat
    - pip3 install --break-system-packages -e .
    - pip3 install --break-system-packages pytest pytest-asyncio pytest-timeout
    - pytest -v --asyncio-mode=strict --junitxml=report.xml --timeout=30 tests/
  artifacts:
    reports:
      junit: report.xml
    when: always
    expire_in: 1 day

publish_wheel:
  stage: build
  needs: ["build_wheel"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-.*$/'
  script:
    - pip3 install --break-system-packages twine
    - python3 -m twine upload --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" dist/*
  variables:
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"

# Publish the same release to the HQ Nexus hosted PyPI repo (pypi-molo17),
# so consumers can install gluesync-sdk from the Nexus group index without a GitLab token.
# NEXUS_PYPI_USER / NEXUS_PYPI_PASSWORD: masked CI variables (Nexus user ci-pypi-deploy).
publish_wheel_nexus:
  stage: build
  needs: ["build_wheel"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-.*$/'
  script:
    - test -n "$NEXUS_PYPI_USER" && test -n "$NEXUS_PYPI_PASSWORD" || { echo "NEXUS_PYPI_USER/NEXUS_PYPI_PASSWORD not set"; exit 1; }
    - pip3 install --break-system-packages twine
    - python3 -m twine upload --repository-url "https://nexus.hq.molo17.com/repository/pypi-molo17/" -u "$NEXUS_PYPI_USER" -p "$NEXUS_PYPI_PASSWORD" dist/*
